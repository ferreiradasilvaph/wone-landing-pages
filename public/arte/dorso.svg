<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500">
  <!--
    O dorso do marco 500K: pescoco, tronco e bracos, cortados nas quatro
    pontas, com a foto real do colar vestida nele.

    POR QUE OS BRACOS SO AGORA APARECEM. Nas versoes anteriores eles existiam
    e nao se viam, porque caiam colados a lateral do peito: braco encostado
    no tronco nao tem contorno proprio, e a silhueta inteira virava uma laje
    com tres pernas embaixo. Eu defendi aquilo como anatomia — e e, para um
    corpo de verdade —, mas aqui nao e um corpo, e um manequim de joalheria,
    e manequim tem os bracos afastados justamente para que se vejam. Agora
    eles se soltam na axila e descem com vao aberto ate o punho.

    O que permitiu afastar e um detalhe do recorte: a foto so e recortada
    ACIMA de y 455. Esse recorte existe para cortar as duas pontas soltas da
    corrente — a esquerda contra o pescoco, a direita contra o ombro — e nada
    mais. Abaixo dali o pingente pende na frente do corpo, como pingente
    pende, e passa por cima de tudo. Ou seja: o tronco nao precisa ser tao
    largo quanto o pingente, e nunca precisou. Enquanto eu recortava a foto
    inteira, cada vao serrava a joia, e era isso que obrigava o corpo a ser
    um bloco macico de 880 de largura — a causa real das quatro versoes em
    que ele parecia um frasco.

    Com o tronco liberado, ele voltou a ter largura de tronco (528, contra os
    880 de antes) e os bracos couberam de fora dele.

    A ESCALA sai da propria foto. A corrente desce cerca de 12 cm do pescoco
    ate o fecho do pingente, e esse trecho mede 240 no arquivo: 20 por
    centimetro. Dai saem cabeca de 460, ombro de dois cabecas, furcula ao
    mamilo uma cabeca, mamilo ao umbigo outra, cotovelo a 1,9 cabeca da
    furcula e punho a 2,6. O pescoco visivel tem 165 — foi o erro de ter
    dado o triplo disso que fez a peca ler como frasco por tres versoes.

    A pintura segue a receita do pulso do 100K: degrade atravessando a
    largura para o cilindro, realces em degrade radial que acabam em nada, e
    anatomia em sombra larga — nunca linha clara e fina, que do tamanho em
    que isto aparece le como risco. Cada braco tem o cilindro dele; o degrade
    do tronco e medido na largura do peito e os deixaria chapados.

    O DESENHO procura, de cima para baixo: os dois esternocleidomastoideos em
    V ate a furcula; a clavicula em S com a fossa escavada por cima; o
    deltoide como touca, com a insercao em V no meio do umero; a borda de
    baixo do peitoral, que e aresta e nao degrade; as digitacoes do serratil,
    diagonais; biceps por dentro e triceps por fora, o olecrano pegando luz
    no cotovelo e o braquiorradial engrossando o antebraco logo abaixo; e no
    abdome a linha alba, duas intersecoes tendineas e a crista iliaca.

    A foto entra no quadro x 76..956 / y 150..958.
    O comentario de compor.html tem a mesma silhueta copiada.
  -->
  <defs>
    <linearGradient id="cilindro" gradientUnits="userSpaceOnUse"
                    x1="34" y1="0" x2="966" y2="0">
      <stop offset="0" stop-color="#0E0E14"/>
      <stop offset="0.1" stop-color="#23232D"/>
      <stop offset="0.28" stop-color="#31313C"/>
      <stop offset="0.44" stop-color="#2A2A34"/>
      <stop offset="0.66" stop-color="#1C1C24"/>
      <stop offset="0.86" stop-color="#111118"/>
      <stop offset="0.95" stop-color="#1F141A"/>
      <stop offset="1" stop-color="#301D12"/>
    </linearGradient>

    <radialGradient id="realce">
      <stop offset="0" stop-color="#F2F2FA" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#F2F2FA" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#F2F2FA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sombra">
      <stop offset="0" stop-color="#000000" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#000000" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="oco" cx="0.5" cy="0.78" r="0.8">
      <stop offset="0" stop-color="#07070A"/>
      <stop offset="0.55" stop-color="#0D0D12"/>
      <stop offset="1" stop-color="#1A1A21"/>
    </radialGradient>

    <!--
