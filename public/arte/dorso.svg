      trapezio, deltoide, braco esquerdo inteiro ate o corte do punho, volta
      pela borda de dentro ate o apice do vao na axila (230, 520), desce a
      lateral do tronco, corte do quadril, e o mesmo do outro lado. Os apices
      sao as axilas: dali para baixo braco e tronco sao duas coisas.
    -->
    <path id="silhueta" d="M372 60
      C 366 140 364 180 364 225
      C 330 246 286 266 236 288
      C 150 318 36 388 34 470
      C 40 540 58 596 64 640
      C 58 700 52 756 54 800
      C 60 900 72 990 76 1060
      C 66 1100 56 1130 56 1152
      C 62 1220 72 1280 82 1330
      C 90 1390 98 1430 100 1448
      A 59 15 0 0 0 218 1448
      C 216 1400 212 1360 212 1330
      C 200 1250 190 1190 192 1150
      C 194 1060 198 1000 200 950
      C 206 860 212 770 215 700
      C 220 620 226 560 230 520
      C 234 600 236 660 236 700
      C 244 800 250 880 252 950
      C 260 1040 266 1100 268 1150
      C 262 1230 252 1300 248 1330
      A 252 38 0 0 0 752 1330
      C 748 1300 738 1230 732 1150
      C 734 1100 740 1040 748 950
      C 750 880 756 800 764 700
      C 764 660 766 600 770 500
      C 774 560 780 620 785 700
      C 788 770 794 860 800 950
      C 802 1000 806 1060 808 1150
      C 810 1190 800 1250 788 1330
      C 788 1360 784 1400 782 1448
      A 59 15 0 0 0 900 1448
      C 902 1430 910 1390 918 1330
      C 928 1280 938 1220 944 1152
      C 944 1130 934 1100 924 1060
      C 928 990 940 900 946 800
      C 948 756 942 700 936 640
      C 942 596 960 540 966 470
      C 964 388 850 318 764 288
      C 714 266 670 246 636 225
      C 636 180 634 140 628 60
      A 128 36 0 0 0 372 60 Z"/>
    <clipPath id="corpo"><use href="#silhueta"/></clipPath>

    <path id="ladoD" d="M628 60 C 634 140 636 180 636 225
      C 670 246 714 266 764 288 C 850 318 964 388 966 470
      C 960 540 942 596 936 640 C 942 700 948 756 946 800
      C 940 900 928 990 924 1060 C 934 1100 944 1130 944 1152
      C 938 1220 928 1280 918 1330 C 910 1390 902 1430 900 1448"/>
    <path id="ladoE" d="M372 60 C 366 140 364 180 364 225
      C 330 246 286 266 236 288 C 150 318 36 388 34 470
      C 40 540 58 596 64 640 C 58 700 52 756 54 800
      C 60 900 72 990 76 1060 C 66 1100 56 1130 56 1152
      C 62 1220 72 1280 82 1330 C 90 1390 98 1430 100 1448"/>
    <!-- as bordas de dentro: braco e tronco, de cada lado do vao -->
    <path id="dentroE" d="M218 1448 C 216 1400 212 1360 212 1330
      C 200 1250 190 1190 192 1150 C 194 1060 198 1000 200 950
      C 206 860 212 770 215 700 C 220 620 226 560 230 520"/>
    <path id="flancoE" d="M230 520 C 234 600 236 660 236 700
      C 244 800 250 880 252 950 C 260 1040 266 1100 268 1150
      C 262 1230 252 1300 248 1330"/>
    <path id="dentroD" d="M770 500 C 774 560 780 620 785 700
      C 788 770 794 860 800 950 C 802 1000 806 1060 808 1150
      C 810 1190 800 1250 788 1330 C 788 1360 784 1400 782 1448"/>
    <path id="flancoD" d="M752 1330 C 748 1300 738 1230 732 1150
      C 734 1100 740 1040 748 950 C 750 880 756 800 764 700
      C 764 660 766 600 770 500"/>
    <path id="baseE" d="M100 1448 A 59 15 0 0 0 218 1448"/>
    <path id="baseC" d="M248 1330 A 252 38 0 0 0 752 1330"/>
    <path id="baseD" d="M782 1448 A 59 15 0 0 0 900 1448"/>
  </defs>

  <use href="#silhueta" fill="url(#cilindro)"/>

  <g clip-path="url(#corpo)" fill="none" stroke-linecap="round">
    <!-- ===================== PESCOCO =====================
         Curto, como pescoco e. Cilindro proprio: o degrade do tronco e
         medido na largura do peito e o deixaria chapado. -->
    <path d="M430 76 C 428 130 426 180 426 226"
          stroke="#F2F2FA" stroke-opacity="0.09" stroke-width="86"/>
    <path d="M372 82 C 370 134 368 182 368 224"
          stroke="#000000" stroke-opacity="0.34" stroke-width="36"/>
    <path d="M622 82 C 624 134 626 182 626 224"
          stroke="#000000" stroke-opacity="0.44" stroke-width="52"/>
    <!-- os dois esternocleidomastoideos descendo em V ate a furcula -->
    <path d="M440 80 C 432 136 454 200 488 244"
          stroke="#F2F2FA" stroke-opacity="0.06" stroke-width="29"/>
    <path d="M558 82 C 568 138 546 202 512 244"
          stroke="#F2F2FA" stroke-opacity="0.032" stroke-width="27"/>
    <path d="M500 108 C 500 156 500 202 500 236"
          stroke="#000000" stroke-opacity="0.16" stroke-width="15"/>

    <!-- ===================== CINTURA ESCAPULAR ===================== -->
    <ellipse cx="352" cy="272" rx="88" ry="36" fill="url(#sombra)"
             opacity="0.54" stroke="none"/>
    <ellipse cx="646" cy="268" rx="82" ry="34" fill="url(#sombra)"
             opacity="0.6" stroke="none"/>
    <!-- o alto do trapezio, que recebe a luz de cima -->
    <path d="M356 240 C 306 254 258 272 220 292"
          stroke="#F2F2FA" stroke-opacity="0.06" stroke-width="46"/>
    <path d="M644 238 C 694 252 740 270 778 290"
          stroke="#F2F2FA" stroke-opacity="0.03" stroke-width="42"/>
    <!-- a clavicula em S, do acromio ate a furcula -->
    <path d="M240 320 C 318 326 418 318 494 290"
          stroke="#F2F2FA" stroke-opacity="0.085" stroke-width="16"/>
    <path d="M760 318 C 684 324 586 318 512 288"
          stroke="#F2F2FA" stroke-opacity="0.05" stroke-width="16"/>
    <path d="M244 342 C 320 348 418 340 494 312"
          stroke="#000000" stroke-opacity="0.26" stroke-width="15"/>
    <path d="M760 340 C 684 346 586 340 512 310"
          stroke="#000000" stroke-opacity="0.3" stroke-width="15"/>
    <ellipse cx="502" cy="268" rx="34" ry="21" fill="url(#sombra)"
             opacity="0.52" stroke="none"/>

    <!-- ===================== DELTOIDE =====================
         A touca que cobre a articulacao, com a insercao em V no meio do
         umero: e esse V que impede o braco de nascer do tronco como cano. -->
    <ellipse cx="112" cy="448" rx="108" ry="120" fill="url(#realce)"
             opacity="0.26" stroke="none"/>
    <ellipse cx="890" cy="436" rx="92" ry="110" fill="url(#sombra)"
             opacity="0.32" stroke="none"/>
    <ellipse cx="920" cy="414" rx="40" ry="84" fill="url(#realce)"
             opacity="0.08" stroke="none"/>
    <!-- o sulco deltopeitoral, do acromio para a axila -->
    <path d="M240 330 C 228 388 226 448 230 506"
          stroke="#000000" stroke-opacity="0.3" stroke-width="22"/>
    <path d="M760 328 C 772 386 774 444 770 492"
          stroke="#000000" stroke-opacity="0.36" stroke-width="22"/>
    <!-- a insercao em V -->
    <path d="M58 644 C 90 680 134 688 170 674"
          stroke="#000000" stroke-opacity="0.32" stroke-width="19"/>
    <path d="M940 636 C 908 672 866 680 832 666"
          stroke="#000000" stroke-opacity="0.36" stroke-width="19"/>
    <path d="M60 620 C 92 656 136 664 172 652"
          stroke="#F2F2FA" stroke-opacity="0.055" stroke-width="14"/>

    <!-- ===================== AXILA =====================
         O vinco fundo onde o braco larga o tronco. -->
    <ellipse cx="236" cy="516" rx="48" ry="42" fill="url(#sombra)"
             opacity="0.68" stroke="none"/>
    <ellipse cx="764" cy="498" rx="46" ry="40" fill="url(#sombra)"
             opacity="0.72" stroke="none"/>

    <!-- ===================== PEITORAL =====================
         O que conta e a borda de baixo, que e aresta e nao degrade. -->
    <ellipse cx="368" cy="622" rx="118" ry="104" fill="url(#realce)"
             opacity="0.11" stroke="none"/>
    <ellipse cx="636" cy="630" rx="112" ry="100" fill="url(#realce)"
             opacity="0.05" stroke="none"/>
    <path d="M250 672 C 310 750 392 780 488 780"
          stroke="#000000" stroke-opacity="0.3" stroke-width="19"/>
    <path d="M750 668 C 692 746 612 776 512 778"
          stroke="#000000" stroke-opacity="0.34" stroke-width="19"/>
    <path d="M500 290 L 500 840"
          stroke="#000000" stroke-opacity="0.14" stroke-width="32"/>

    <!-- ===================== SERRATIL =====================
         As digitacoes nas costelas, diagonais. -->
    <g stroke="#F2F2FA" stroke-opacity="0.045" stroke-width="15">
      <path d="M262 796 C 288 818 314 830 338 836"/>
      <path d="M266 848 C 292 872 318 884 340 890"/>
      <path d="M274 898 C 298 922 322 934 344 940"/>
    </g>
    <g stroke="#F2F2FA" stroke-opacity="0.025" stroke-width="13">
      <path d="M738 790 C 714 814 690 826 668 832"/>
      <path d="M742 842 C 718 866 696 878 674 884"/>
    </g>

    <!-- ===================== BRACO ESQUERDO =====================
         Biceps por dentro pegando luz, triceps por fora na sombra, o
         olecrano claro no cotovelo e o braquiorradial engrossando o
         antebraco logo abaixo dele. -->
    <path d="M104 700 C 94 800 92 900 100 1030"
          stroke="#F2F2FA" stroke-opacity="0.095" stroke-width="50"/>
    <path d="M60 720 C 56 820 62 920 78 1030"
          stroke="#000000" stroke-opacity="0.22" stroke-width="20"/>
    <path d="M190 700 C 196 800 200 900 200 1020"
          stroke="#000000" stroke-opacity="0.4" stroke-width="38"/>
    <ellipse cx="118" cy="800" rx="52" ry="86" fill="url(#realce)"
             opacity="0.11" stroke="none"/>
    <ellipse cx="86" cy="1156" rx="38" ry="44" fill="url(#realce)"
             opacity="0.15" stroke="none"/>
    <path d="M76 1094 C 108 1110 150 1110 182 1100"
          stroke="#000000" stroke-opacity="0.22" stroke-width="16"/>
    <path d="M114 1208 C 108 1290 112 1370 120 1428"
          stroke="#F2F2FA" stroke-opacity="0.08" stroke-width="38"/>
    <path d="M186 1216 C 190 1300 190 1380 190 1430"
          stroke="#000000" stroke-opacity="0.36" stroke-width="26"/>
    <ellipse cx="124" cy="1260" rx="42" ry="60" fill="url(#realce)"
             opacity="0.07" stroke="none"/>
    <path d="M106 1406 C 128 1418 164 1418 184 1408"
          stroke="#000000" stroke-opacity="0.2" stroke-width="12"/>

    <!-- ===================== BRACO DIREITO ===================== -->
    <path d="M896 686 C 890 790 888 890 900 1030"
          stroke="#F2F2FA" stroke-opacity="0.05" stroke-width="42"/>
    <path d="M940 706 C 944 806 938 910 922 1030"
          stroke="#000000" stroke-opacity="0.26" stroke-width="20"/>
    <path d="M810 690 C 804 790 798 890 800 1020"
          stroke="#000000" stroke-opacity="0.46" stroke-width="36"/>
    <ellipse cx="884" cy="796" rx="44" ry="82" fill="url(#realce)"
             opacity="0.05" stroke="none"/>
    <ellipse cx="914" cy="1156" rx="34" ry="42" fill="url(#realce)"
             opacity="0.07" stroke="none"/>
    <path d="M924 1094 C 894 1110 854 1110 822 1100"
          stroke="#000000" stroke-opacity="0.24" stroke-width="16"/>
    <path d="M886 1208 C 892 1290 888 1370 880 1428"
          stroke="#F2F2FA" stroke-opacity="0.045" stroke-width="34"/>
    <path d="M814 1216 C 810 1300 810 1380 810 1430"
          stroke="#000000" stroke-opacity="0.4" stroke-width="24"/>
    <path d="M894 1406 C 872 1418 838 1418 818 1408"
          stroke="#000000" stroke-opacity="0.22" stroke-width="12"/>

    <!-- ===================== ABDOME E QUADRIL ===================== -->
    <path d="M492 880 C 488 1000 490 1130 494 1300"
          stroke="#F2F2FA" stroke-opacity="0.055" stroke-width="104"/>
    <path d="M296 920 C 306 1030 312 1180 310 1300"
          stroke="#000000" stroke-opacity="0.26" stroke-width="44"/>
    <path d="M704 920 C 694 1030 688 1180 690 1300"
          stroke="#000000" stroke-opacity="0.34" stroke-width="48"/>
    <path d="M500 870 L 500 1220"
          stroke="#000000" stroke-opacity="0.17" stroke-width="18"/>
    <path d="M404 920 C 440 934 560 934 596 920"
          stroke="#000000" stroke-opacity="0.15" stroke-width="12"/>
    <path d="M396 1020 C 436 1036 564 1036 604 1020"
          stroke="#000000" stroke-opacity="0.15" stroke-width="12"/>
    <ellipse cx="498" cy="1130" rx="20" ry="25" fill="url(#sombra)"
             opacity="0.44" stroke="none"/>
    <path d="M296 1216 C 358 1258 428 1276 492 1280"
          stroke="#F2F2FA" stroke-opacity="0.055" stroke-width="16"/>
    <path d="M704 1216 C 642 1258 572 1276 508 1280"
          stroke="#F2F2FA" stroke-opacity="0.035" stroke-width="16"/>

    <!-- os cortes de baixo sao vistos por baixo: nao se ve o vazio, ve-se a
         aresta, e a barriga de cada um fica na sombra -->
    <ellipse cx="500" cy="1392" rx="252" ry="82" fill="#000000"
             opacity="0.5" stroke="none"/>
    <ellipse cx="159" cy="1488" rx="59" ry="40" fill="#000000"
             opacity="0.45" stroke="none"/>
    <ellipse cx="841" cy="1488" rx="59" ry="40" fill="#000000"
             opacity="0.5" stroke="none"/>
  </g>

  <!-- ===================== O CONTORNO =====================
       So a luz que lambe a borda: acesa na direita, fria na esquerda, que e o
       mesmo par de luzes do acrilico das placas. As bordas do vao recebem o
       seu fio tambem — o vao e do mesmo preto do fundo, e sem luz nas duas
       margens o braco nao se descola do tronco. -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#FF7700">
      <use href="#ladoD" stroke-width="30" opacity="0.09"/>
      <use href="#ladoD" stroke-width="11" opacity="0.17"/>
      <use href="#ladoD" stroke-width="2.8" opacity="0.52"/>
      <use href="#dentroD" stroke-width="10" opacity="0.11"/>
      <use href="#dentroD" stroke-width="2.2" opacity="0.34"/>
      <use href="#flancoD" stroke-width="8" opacity="0.07"/>
      <use href="#flancoD" stroke-width="1.8" opacity="0.2"/>
      <use href="#baseC" stroke-width="18" opacity="0.07"/>
      <use href="#baseC" stroke-width="2.8" opacity="0.38"/>
      <use href="#baseD" stroke-width="2.2" opacity="0.32"/>
    </g>
    <g stroke="#E6EAF6">
      <use href="#ladoE" stroke-width="22" opacity="0.07"/>
      <use href="#ladoE" stroke-width="9" opacity="0.14"/>
      <use href="#ladoE" stroke-width="2.4" opacity="0.48"/>
      <use href="#dentroE" stroke-width="10" opacity="0.08"/>
      <use href="#dentroE" stroke-width="2.2" opacity="0.32"/>
      <use href="#flancoE" stroke-width="8" opacity="0.06"/>
      <use href="#flancoE" stroke-width="1.8" opacity="0.2"/>
      <use href="#baseE" stroke-width="2.2" opacity="0.26"/>
    </g>
  </g>

  <!-- ===================== O CORTE DO PESCOCO =====================
       Vazio escuro com a aresta da frente acesa. Luz por dentro foi o que, na
       primeira versao, fez a peca ler como frasco. -->
  <ellipse cx="500" cy="60" rx="128" ry="36" fill="url(#oco)" stroke="none"/>
  <path d="M388 50 A 112 26 0 0 1 612 50" fill="none"
        stroke="#F2F2FA" stroke-opacity="0.12" stroke-width="7"/>
  <ellipse cx="500" cy="60" rx="128" ry="36" fill="none"
           stroke="#E6EAF6" stroke-opacity="0.22" stroke-width="2.4"/>
  <path d="M372 60 A 128 36 0 0 0 628 60" fill="none"
        stroke="#FF7700" stroke-opacity="0.1" stroke-width="16"/>
  <path d="M372 60 A 128 36 0 0 0 628 60" fill="none"
