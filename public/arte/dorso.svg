<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1520" width="1000" height="1520">
  <!--
    O dorso do marco 500K: pescoco, tronco e bracos inteiros, cortados nas
    quatro pontas, com a foto real do colar vestida nele.

    POR QUE OS BRACOS DESCEM ATE O PUNHO. Na versao anterior eles iam so ate
    logo abaixo do cotovelo e, pior, ficavam colados ao tronco quase toda a
    extensao. O resultado e que nao existiam: braco encostado no peito nao
    tem contorno proprio, e o pouco de vao que sobrava embaixo ficava atras
    do pingente. Agora eles se soltam na altura em que a cintura estreita e
    seguem ate o punho — sao 420 de vao aberto abaixo do pingente, e e isso
    que faz o olho ler dois bracos em vez de um bloco com tres pernas.

    O vao nao pode subir mais que isso, e nao e escolha: braco em repouso
    encosta mesmo na lateral do peito, porque o torax e mais largo que a
    distancia em que o braco cai. Abrir o vao na altura do peito pediria
    afastar os bracos do corpo, e o quadro nao tem essa largura sem encolher
    a joia.

    A ESCALA sai da propria foto. A corrente desce cerca de 12 cm do pescoco
    ate o fecho do pingente, e esse trecho mede 240 no arquivo: 20 por
    centimetro. Com isso tudo se amarra — cabeca de 460, ombro de dois
    cabecas, furcula ao mamilo uma cabeca, mamilo ao umbigo outra, cotovelo a
    1,9 cabeca da furcula e punho a 2,6. Foi essa conta que, na versao
    anterior, revelou o erro que segurava o desenho havia tres versoes: o
    pescoco tinha o triplo do comprimento devido, e por isso a peca lia como
    frasco de perfume toda vez que ganhava volume.

    O RECORTE DA FOTO so vale acima de y 528. Ele existe para cortar as duas
    pontas soltas da corrente — a esquerda contra o pescoco, a direita contra
    o ombro — e nada mais. Abaixo dali o pingente pende na frente do corpo,
    como pingente pende, e passa por cima de tudo, inclusive do vao entre
    braco e tronco. E o que libera a silhueta: enquanto a foto era recortada
    inteira, cada vao serrava a joia e o corpo tinha de ser um bloco macico.

    A pintura segue a receita do pulso do 100K: degrade atravessando a
    largura para o cilindro, realces em degrade radial que acabam em nada, e
    anatomia em sombra larga — nunca linha clara e fina, que do tamanho em
    que isto aparece le como risco. Cada braco tem o cilindro dele; o degrade
    do tronco e medido na largura do peito e os deixaria chapados.

    O QUE O DESENHO PROCURA, de cima para baixo: os dois
    esternocleidomastoideos em V ate a furcula; a clavicula em S com a fossa
    escavada por cima; o deltoide como touca, com a insercao em V no meio do
    umero — e esse V que impede o braco de nascer do tronco como um cano; a
    borda de baixo do peitoral, que e aresta e nao degrade; as digitacoes do
    serratil, diagonais; biceps por dentro e triceps por fora, o olecrano
    pegando luz no cotovelo e o braquiorradial engrossando o antebraco logo
    abaixo dele; e no abdome a linha alba, duas intersecoes tendineas e a
    crista iliaca fechando sobre o quadril.

    A foto entra no quadro x 76..956 / y 220..1028.
    O comentario de compor.html tem a mesma silhueta copiada.
  -->
  <defs>
    <linearGradient id="cilindro" gradientUnits="userSpaceOnUse"
                    x1="40" y1="0" x2="956" y2="0">
      <stop offset="0" stop-color="#0D0D12"/>
      <stop offset="0.1" stop-color="#20202A"/>
      <stop offset="0.28" stop-color="#2D2D38"/>
      <stop offset="0.44" stop-color="#26262F"/>
      <stop offset="0.66" stop-color="#1A1A21"/>
      <stop offset="0.86" stop-color="#101016"/>
      <stop offset="0.95" stop-color="#1D1319"/>
      <stop offset="1" stop-color="#2E1C11"/>
    </linearGradient>

    <radialGradient id="realce">
      <stop offset="0" stop-color="#F2F2FA" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#F2F2FA" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#F2F2FA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sombra">
      <stop offset="0" stop-color="#000000" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#000000" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="oco" cx="0.5" cy="0.78" r="0.8">
      <stop offset="0" stop-color="#07070A"/>
      <stop offset="0.55" stop-color="#0D0D12"/>
      <stop offset="1" stop-color="#1A1A21"/>
    </radialGradient>

    <!--
      A silhueta, no sentido horario a partir do corte do pescoco: pescoco,
      trapezio, deltoide, braco esquerdo inteiro ate o corte do punho, volta
      pela borda de dentro ate o apice do vao (232, 950), desce a lateral do
      tronco, corte do quadril, sobe a outra lateral, e o mesmo do outro
      lado. Os apices sao o ponto em que o tronco fica mais estreito que a
      borda de dentro do braco — e e so dali para baixo que existe vao.
    -->
    <path id="silhueta" d="M370 60
      C 364 130 362 180 362 225
      C 352 258 300 282 240 312
      C 160 350 42 396 40 456
      C 44 520 70 580 92 630
      C 84 680 76 730 76 780
      C 84 860 98 930 104 1000
      C 92 1050 82 1082 82 1105
      C 88 1180 96 1250 104 1300
      C 112 1370 120 1420 122 1440
      A 43 14 0 0 0 208 1440
      C 204 1360 198 1250 200 1180
      C 212 1090 226 1010 232 950
      C 242 1030 256 1130 258 1200
      C 256 1270 252 1310 250 1330
      A 250 38 0 0 0 750 1330
      C 748 1310 744 1270 742 1200
      C 744 1130 758 1030 768 950
      C 774 1010 788 1090 800 1180
      C 802 1250 796 1400 792 1440
      A 42 14 0 0 0 876 1440
      C 880 1400 888 1350 892 1300
      C 902 1240 912 1160 916 1105
      C 914 1070 902 1030 894 1000
      C 902 930 914 860 920 780
      C 918 720 910 664 904 612
      C 928 562 958 496 956 436
      C 958 396 836 350 756 312
      C 696 282 644 258 634 225
      C 634 180 632 130 626 60
      A 128 36 0 0 0 370 60 Z"/>
    <clipPath id="corpo"><use href="#silhueta"/></clipPath>

    <path id="ladoD" d="M626 60 C 632 130 634 180 634 225
      C 644 258 696 282 756 312 C 836 350 958 396 956 436
      C 958 496 928 562 904 612 C 910 664 918 720 920 780
      C 914 860 902 930 894 1000 C 902 1030 914 1070 916 1105
      C 912 1160 902 1240 892 1300 C 888 1350 880 1400 876 1440"/>
    <path id="ladoE" d="M370 60 C 364 130 362 180 362 225
      C 352 258 300 282 240 312 C 160 350 42 396 40 456
      C 44 520 70 580 92 630 C 84 680 76 730 76 780
      C 84 860 98 930 104 1000 C 92 1050 82 1082 82 1105
      C 88 1180 96 1250 104 1300 C 112 1370 120 1420 122 1440"/>
    <path id="dentroE" d="M208 1440 C 204 1360 198 1250 200 1180
      C 212 1090 226 1010 232 950"/>
    <path id="dentroD" d="M768 950 C 774 1010 788 1090 800 1180
      C 802 1250 796 1400 792 1440"/>
    <path id="baseE" d="M122 1440 A 43 14 0 0 0 208 1440"/>
    <path id="baseC" d="M250 1330 A 250 38 0 0 0 750 1330"/>
    <path id="baseD" d="M792 1440 A 42 14 0 0 0 876 1440"/>
  </defs>

  <use href="#silhueta" fill="url(#cilindro)"/>

  <g clip-path="url(#corpo)" fill="none" stroke-linecap="round">
    <!-- ===================== PESCOCO =====================
         Curto, como pescoco e. Cilindro proprio: o degrade do tronco e
         medido na largura do peito e o deixaria chapado. -->
    <path d="M428 76 C 426 130 424 180 424 226"
          stroke="#F2F2FA" stroke-opacity="0.09" stroke-width="88"/>
    <path d="M370 82 C 368 134 366 182 366 224"
          stroke="#000000" stroke-opacity="0.34" stroke-width="38"/>
    <path d="M620 82 C 622 134 624 182 624 224"
          stroke="#000000" stroke-opacity="0.44" stroke-width="54"/>
    <!-- os dois esternocleidomastoideos descendo em V ate a furcula -->
    <path d="M438 80 C 430 140 452 206 486 248"
          stroke="#F2F2FA" stroke-opacity="0.06" stroke-width="30"/>
    <path d="M556 82 C 566 142 544 208 510 248"
          stroke="#F2F2FA" stroke-opacity="0.032" stroke-width="28"/>
    <path d="M498 110 C 498 160 498 206 498 240"
          stroke="#000000" stroke-opacity="0.16" stroke-width="15"/>

    <!-- ===================== CINTURA ESCAPULAR ===================== -->
    <ellipse cx="346" cy="282" rx="96" ry="40" fill="url(#sombra)"
             opacity="0.54" stroke="none"/>
    <ellipse cx="636" cy="268" rx="88" ry="36" fill="url(#sombra)"
             opacity="0.6" stroke="none"/>
    <path d="M356 240 C 300 258 244 288 198 322"
          stroke="#F2F2FA" stroke-opacity="0.06" stroke-width="54"/>
    <path d="M640 236 C 696 254 752 284 798 316"
          stroke="#F2F2FA" stroke-opacity="0.03" stroke-width="48"/>
    <!-- a clavicula em S, do acromio ate a furcula -->
    <path d="M212 338 C 300 340 406 334 492 300"
          stroke="#F2F2FA" stroke-opacity="0.08" stroke-width="16"/>
    <path d="M790 322 C 706 326 602 324 514 296"
          stroke="#F2F2FA" stroke-opacity="0.05" stroke-width="16"/>
    <path d="M216 360 C 302 364 406 356 492 322"
          stroke="#000000" stroke-opacity="0.26" stroke-width="15"/>
    <path d="M790 344 C 706 348 602 346 514 318"
          stroke="#000000" stroke-opacity="0.3" stroke-width="15"/>
    <ellipse cx="500" cy="276" rx="36" ry="22" fill="url(#sombra)"
             opacity="0.52" stroke="none"/>

    <!-- ===================== DELTOIDE =====================
         A touca que cobre a articulacao, com a insercao em V no meio do
         umero: e esse V que impede o braco de nascer do tronco como cano. -->
    <ellipse cx="118" cy="486" rx="116" ry="128" fill="url(#realce)"
             opacity="0.24" stroke="none"/>
    <ellipse cx="882" cy="472" rx="98" ry="114" fill="url(#sombra)"
             opacity="0.3" stroke="none"/>
    <ellipse cx="912" cy="450" rx="42" ry="86" fill="url(#realce)"
             opacity="0.08" stroke="none"/>
    <path d="M226 348 C 214 406 212 452 222 498"
          stroke="#000000" stroke-opacity="0.3" stroke-width="24"/>
    <path d="M770 332 C 782 392 784 438 774 484"
          stroke="#000000" stroke-opacity="0.36" stroke-width="24"/>
    <path d="M94 636 C 128 672 170 680 206 666"
          stroke="#000000" stroke-opacity="0.32" stroke-width="20"/>
    <path d="M902 618 C 870 654 832 662 798 648"
          stroke="#000000" stroke-opacity="0.36" stroke-width="20"/>
    <path d="M96 612 C 130 648 172 656 208 644"
          stroke="#F2F2FA" stroke-opacity="0.055" stroke-width="15"/>

    <!-- ===================== AXILA =====================
         O vinco fundo onde o braco encosta no tronco, e a juncao que desce
         ate o apice do vao. -->
    <ellipse cx="224" cy="512" rx="58" ry="48" fill="url(#sombra)"
             opacity="0.66" stroke="none"/>
    <ellipse cx="774" cy="492" rx="54" ry="44" fill="url(#sombra)"
             opacity="0.72" stroke="none"/>
    <path d="M226 530 C 230 650 230 800 232 950"
          stroke="#000000" stroke-opacity="0.48" stroke-width="24"/>
    <path d="M772 510 C 768 640 766 790 768 950"
          stroke="#000000" stroke-opacity="0.54" stroke-width="22"/>

    <!-- ===================== PEITORAL =====================
         O que conta e a borda de baixo, que e aresta e nao degrade. -->
    <ellipse cx="344" cy="640" rx="148" ry="112" fill="url(#realce)"
             opacity="0.1" stroke="none"/>
    <ellipse cx="648" cy="648" rx="138" ry="106" fill="url(#realce)"
             opacity="0.045" stroke="none"/>
    <path d="M250 690 C 318 776 404 806 484 806"
          stroke="#000000" stroke-opacity="0.28" stroke-width="20"/>
    <path d="M750 684 C 684 772 598 802 514 804"
          stroke="#000000" stroke-opacity="0.32" stroke-width="20"/>
    <path d="M498 300 L 498 880"
          stroke="#000000" stroke-opacity="0.13" stroke-width="36"/>

    <!-- ===================== SERRATIL =====================
         As digitacoes nas costelas, diagonais, entrelacando com o obliquo. -->
    <g stroke="#F2F2FA" stroke-opacity="0.042" stroke-width="16">
      <path d="M252 812 C 282 836 312 850 340 856"/>
      <path d="M256 866 C 284 892 312 906 338 912"/>
      <path d="M266 918 C 292 944 318 956 342 962"/>
    </g>
    <g stroke="#F2F2FA" stroke-opacity="0.024" stroke-width="14">
      <path d="M748 802 C 722 828 696 842 672 848"/>
      <path d="M744 856 C 718 882 694 896 670 902"/>
    </g>

    <!-- ===================== BRACO ESQUERDO =====================
         Biceps por dentro pegando luz, triceps por fora na sombra, o
         olecrano claro no cotovelo e o braquiorradial engrossando o
         antebraco logo abaixo dele. -->
    <path d="M124 680 C 112 790 108 900 112 1010"
          stroke="#F2F2FA" stroke-opacity="0.09" stroke-width="56"/>
    <path d="M74 700 C 70 810 76 920 90 1020"
          stroke="#000000" stroke-opacity="0.2" stroke-width="22"/>
    <path d="M196 690 C 204 800 212 900 220 1000"
          stroke="#000000" stroke-opacity="0.4" stroke-width="44"/>
    <ellipse cx="140" cy="800" rx="58" ry="92" fill="url(#realce)"
             opacity="0.1" stroke="none"/>
    <!-- o cotovelo -->
    <ellipse cx="108" cy="1108" rx="42" ry="46" fill="url(#realce)"
             opacity="0.14" stroke="none"/>
    <path d="M100 1046 C 132 1062 170 1062 198 1052"
          stroke="#000000" stroke-opacity="0.22" stroke-width="17"/>
    <!-- o antebraco: engrossa logo abaixo do cotovelo e afina no punho -->
    <path d="M140 1160 C 134 1250 138 1340 148 1420"
          stroke="#F2F2FA" stroke-opacity="0.075" stroke-width="44"/>
    <path d="M196 1170 C 200 1260 198 1350 196 1420"
          stroke="#000000" stroke-opacity="0.36" stroke-width="30"/>
    <ellipse cx="152" cy="1216" rx="48" ry="68" fill="url(#realce)"
             opacity="0.07" stroke="none"/>
    <path d="M128 1398 C 152 1410 186 1410 206 1400"
          stroke="#000000" stroke-opacity="0.2" stroke-width="13"/>

    <!-- ===================== BRACO DIREITO ===================== -->
    <path d="M868 666 C 862 780 860 890 886 1010"
          stroke="#F2F2FA" stroke-opacity="0.05" stroke-width="46"/>
    <path d="M918 686 C 922 796 916 910 902 1020"
          stroke="#000000" stroke-opacity="0.24" stroke-width="22"/>
    <path d="M800 670 C 794 786 784 890 780 1000"
          stroke="#000000" stroke-opacity="0.46" stroke-width="40"/>
    <ellipse cx="856" cy="790" rx="48" ry="86" fill="url(#realce)"
             opacity="0.05" stroke="none"/>
    <ellipse cx="890" cy="1108" rx="38" ry="44" fill="url(#realce)"
             opacity="0.07" stroke="none"/>
    <path d="M898 1046 C 866 1062 830 1062 802 1052"
          stroke="#000000" stroke-opacity="0.24" stroke-width="17"/>
    <path d="M858 1160 C 864 1250 860 1340 852 1420"
          stroke="#F2F2FA" stroke-opacity="0.042" stroke-width="40"/>
    <path d="M804 1170 C 800 1260 800 1350 800 1420"
          stroke="#000000" stroke-opacity="0.4" stroke-width="28"/>
    <path d="M872 1398 C 848 1410 816 1410 796 1400"
          stroke="#000000" stroke-opacity="0.22" stroke-width="13"/>

    <!-- ===================== ABDOME E QUADRIL =====================
         A cintura reta e as intersecoes tendineas sao o que desmente uma
         base de frasco; a crista iliaca fecha o tronco embaixo. -->
    <path d="M490 960 C 486 1060 488 1180 492 1310"
          stroke="#F2F2FA" stroke-opacity="0.05" stroke-width="124"/>
    <path d="M312 1000 C 326 1090 336 1200 340 1310"
          stroke="#000000" stroke-opacity="0.26" stroke-width="50"/>
    <path d="M676 1000 C 662 1090 652 1200 648 1310"
          stroke="#000000" stroke-opacity="0.34" stroke-width="56"/>
    <path d="M498 950 L 498 1250"
          stroke="#000000" stroke-opacity="0.17" stroke-width="19"/>
    <path d="M384 996 C 426 1010 570 1010 612 996"
          stroke="#000000" stroke-opacity="0.15" stroke-width="13"/>
    <path d="M376 1086 C 422 1102 574 1102 620 1086"
          stroke="#000000" stroke-opacity="0.15" stroke-width="13"/>
    <ellipse cx="496" cy="1172" rx="21" ry="26" fill="url(#sombra)"
             opacity="0.44" stroke="none"/>
    <path d="M300 1226 C 364 1270 430 1288 492 1292"
          stroke="#F2F2FA" stroke-opacity="0.055" stroke-width="17"/>
    <path d="M692 1226 C 630 1270 566 1288 506 1292"
          stroke="#F2F2FA" stroke-opacity="0.035" stroke-width="17"/>

    <!-- os cortes de baixo sao vistos por baixo: nao se ve o vazio, ve-se a
         aresta, e a barriga de cada um fica na sombra -->
    <ellipse cx="500" cy="1390" rx="250" ry="84" fill="#000000"
             opacity="0.5" stroke="none"/>
    <ellipse cx="165" cy="1478" rx="43" ry="38" fill="#000000"
             opacity="0.45" stroke="none"/>
    <ellipse cx="834" cy="1478" rx="42" ry="38" fill="#000000"
             opacity="0.5" stroke="none"/>
  </g>

  <!-- ===================== O CONTORNO =====================
       So a luz que lambe a borda: acesa na direita, fria na esquerda, que e o
       mesmo par de luzes do acrilico das placas. A borda de dentro de cada
       braco tambem recebe o seu fio — sem ele o vao entre braco e tronco e o
       mesmo preto do fundo, e o braco nao se descola. -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#FF7700">
      <use href="#ladoD" stroke-width="32" opacity="0.09"/>
      <use href="#ladoD" stroke-width="12" opacity="0.17"/>
      <use href="#ladoD" stroke-width="2.8" opacity="0.5"/>
      <use href="#dentroD" stroke-width="11" opacity="0.11"/>
      <use href="#dentroD" stroke-width="2.2" opacity="0.34"/>
      <use href="#baseC" stroke-width="18" opacity="0.07"/>
      <use href="#baseC" stroke-width="2.8" opacity="0.38"/>
      <use href="#baseD" stroke-width="2.2" opacity="0.32"/>
    </g>
    <g stroke="#E6EAF6">
      <use href="#ladoE" stroke-width="24" opacity="0.07"/>
      <use href="#ladoE" stroke-width="9" opacity="0.13"/>
      <use href="#ladoE" stroke-width="2.4" opacity="0.45"/>
      <use href="#dentroE" stroke-width="11" opacity="0.08"/>
      <use href="#dentroE" stroke-width="2.2" opacity="0.3"/>
      <use href="#baseE" stroke-width="2.2" opacity="0.26"/>
    </g>
  </g>

  <!-- ===================== O CORTE DO PESCOCO =====================
       Vazio escuro com a aresta da frente acesa. Luz por dentro foi o que, na
       primeira versao, fez a peca ler como frasco. -->
  <ellipse cx="498" cy="60" rx="128" ry="36" fill="url(#oco)" stroke="none"/>
  <path d="M386 50 A 112 26 0 0 1 610 50" fill="none"
        stroke="#F2F2FA" stroke-opacity="0.12" stroke-width="7"/>
  <ellipse cx="498" cy="60" rx="128" ry="36" fill="none"
           stroke="#E6EAF6" stroke-opacity="0.22" stroke-width="2.4"/>
  <path d="M370 60 A 128 36 0 0 0 626 60" fill="none"
        stroke="#FF7700" stroke-opacity="0.1" stroke-width="16"/>
  <path d="M370 60 A 128 36 0 0 0 626 60" fill="none"
        stroke="#FF7700" stroke-opacity="0.6" stroke-width="3"/>
</svg>
