<!doctype html><meta charset="utf-8"><title>compor as joias vestidas</title>
<!--
  Monta as duas imagens de joia vestida dos marcos 100K e 500K.

  Cada uma e a foto real da peca sobre um corpo desenhado aqui ao lado, em
  SVG. O resultado e derivado: `/images/colar-500k-vestido.webp` e
  `/images/pulseira-100k-vestida.webp`, que sao o que a cena 3D carrega.

  Para refazer: `npm run dev`, abra /arte/compor.html, confira as duas e
  clique em baixar. Os arquivos caem na pasta de downloads com o nome certo;
  e so mover para public/images.

  Esta pagina mora em public/ junto com os SVG porque precisa ser SERVIDA
  para funcionar: desenhar SVG e webp num canvas e ler o resultado de volta
  exige mesma origem. Em file:// o canvas sai contaminado e o toDataURL
  falha. Como os SVG tambem precisam estar aqui, os fontes ficam todos neste
  diretorio em vez de em src/assets — um lugar so, sem copia.
-->
<style>
  body{margin:0;background:#050506;color:#CFCFD6;font:13px ui-monospace,monospace}
  .linha{display:flex;gap:48px;align-items:flex-end;padding:24px}
  figure{margin:0;text-align:center}
  canvas{outline:1px dashed #22222a}
  .grande canvas{height:560px;width:auto}
  .peq canvas{height:200px;width:auto}
  a{color:#FF7700;display:inline-block;margin-top:8px}
  #log{padding:0 24px 24px;white-space:pre-wrap;color:#777}
</style>
<div class="linha grande" id="g"></div>
<div class="linha peq" id="p"></div>
<pre id="log"></pre>
<script>
/* O corpo do 500K. A foto e recortada por ele, e e isso que faz as duas
   pontas da corrente sumirem atras do pescoco e do ombro em vez de acabarem
   no ar. Tem de ser igual ao `silhueta` de dorso.svg. */
const BUSTO = "M348 80 C 340 190 336 300 332 390 C 240 420 166 486 128 562"
  + " C 78 606 36 660 38 726 C 40 792 44 844 48 878"
  + " C 60 912 76 924 90 935 C 98 958 100 972 100 990"
  + " C 128 1066 168 1140 190 1210 C 192 1252 190 1296 188 1330"
  + " A 282 44 0 0 0 752 1330 C 750 1296 748 1252 750 1210"
  + " C 742 1160 734 1150 732 1120 C 734 1070 738 1030 740 1000"
  + " C 758 968 774 944 786 918 C 800 890 812 862 816 832"
  + " C 820 796 822 770 826 746 C 868 700 894 656 886 612"
  + " C 870 560 846 536 802 516 C 736 456 672 414 630 390"
  + " C 626 300 622 190 612 80 A 132 38 0 0 0 348 80 Z";

/* O arco de baixo do vao da pulseira, medido na propria foto. Divide a
   imagem em duas: acima dele o braco passa na frente do metal, abaixo passa
   atras. Os dois recortes partem do mesmo arco, entao nenhum pedaco do braco
   e pintado duas vezes — o que importa, porque ele e semitransparente. */
const ARCO = "L 687.6 421 A 281.6 75.6 0 0 1 124.4 421 L -400 421 Z";
const ACIMA = "M-400 -600 L 1600 -600 L 1600 421 " + ARCO;
const ABAIXO = "M-400 2200 L 1600 2200 L 1600 421 " + ARCO;

const PECAS = [
  {
    nome: "colar-500k-vestido.webp", w: 918, h: 1430,
    arte: "/arte/dorso.svg", foto: "/images/colar-500k.webp",
    quadro: [55, 260, 880, 808],
    camadas: [{ o: "arte" }, { o: "foto", recorte: BUSTO }],
  },
  {
    nome: "pulseira-100k-vestida.webp", w: 843, h: 1199,
    arte: "/arte/pulso.svg", foto: "/images/pulseira-100k.webp",
    quadro: [24.9, 179, 760, 458.3],
    camadas: [
      { o: "arte", recorte: ABAIXO },
      { o: "foto" },
      { o: "arte", recorte: ACIMA },
    ],
  },
];

const log = (s) => (document.getElementById("log").textContent += s + "\n");

/* O SVG precisa de largura e altura explicitas antes de entrar no canvas:
   sem elas o navegador o desenha no tamanho intrinseco e a composicao sai
   fora de escala. */
function carrega(src, w, h) {
  return new Promise((ok, erro) => {
    const i = new Image();
    if (w) { i.width = w; i.height = h; }
    i.onload = () => ok(i);
    i.onerror = () => erro(new Error("falhou: " + src));
    i.src = src;
  });
}

(async () => {
  for (const peca of PECAS) {
    const [arte, foto] = await Promise.all([
      carrega(peca.arte, peca.w, peca.h), carrega(peca.foto),
    ]);
    const c = document.createElement("canvas");
    c.width = peca.w; c.height = peca.h;
    const x = c.getContext("2d");
    const [fx, fy, fw, fh] = peca.quadro;

    for (const camada of peca.camadas) {
      x.save();
      if (camada.recorte) x.clip(new Path2D(camada.recorte));
      if (camada.o === "arte") x.drawImage(arte, 0, 0, peca.w, peca.h);
      else x.drawImage(foto, fx, fy, fw, fh);
      x.restore();
    }

    const url = c.toDataURL("image/webp", 0.92);
    for (const alvo of ["g", "p"]) {
      const fig = document.createElement("figure");
      const v = document.createElement("canvas");
      v.width = peca.w; v.height = peca.h;
      v.getContext("2d").drawImage(c, 0, 0);
      const a = document.createElement("a");
      a.href = url; a.download = peca.nome; a.textContent = "baixar " + peca.nome;
      fig.append(v, document.createElement("br"), a);
      document.getElementById(alvo).append(fig);
    }
    log(peca.nome + "  " + peca.w + "x" + peca.h
        + "  razao " + (peca.w / peca.h).toFixed(4));
  }
})().catch((e) => log("ERRO " + e.message + "\n" + e.stack));
</script>
