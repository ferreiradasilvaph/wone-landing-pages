<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 831 1120" width="831" height="1120">
  <!--
    O pulso do marco 100K.

    A composicao e a mesma de antes — so a passagem do braco pelo aro, um
    trecho acima e outro abaixo, as duas pontas se perdendo no ar — mas o
    braco deixou de ser contorno e virou volume. Como contorno de luz, igual
    ao dorso, ele lia como chapa escura: duas linhas quase retas separadas
    por nada, e nada no meio que dissesse de que lado vem a luz. No dorso
    aquilo funciona porque o contorno e todo curvo e cheio de acidentes; num
    antebraco, que e quase um cilindro, nao sobra desenho nenhum.

    O que o faz braco agora:

    - o degrade atravessado, que e o cilindro. Borda escura, banda de luz a
      um quarto da largura, sombra fechando do outro lado e um rebote quente
      na aresta direita. E a unica coisa que transforma um poligono em algo
      redondo;
    - a silhueta em ampulheta. Estreita no punho, abrindo para cima no ventre
      do antebraco e para baixo na base da mao, com o monte do polegar
      saliente do lado de dentro. Membro nenhum tem lados paralelos;
    - o processo estiloide da ulna, a saliencia do osso logo acima do aro. E
      um acidente pequeno, mas e o que o olho reconhece como punho;
    - os vincos do punho, a sombra que a pulseira joga nele e a veia.
      Superficie, nao contorno — e larga e fraca, nunca linha clara e fina,
      que de longe le como risco e nao como pele.

    As pontas se desfazem por uma mascara, e nao por tinta transparente como
    antes: com o degrade atravessado fazendo o volume, o desvanecer tinha de
    vir por fora, senao cada tinta precisaria do seu proprio.

    A imagem e montada em tres camadas, e a ordem importa: o braco atras, a
    foto, e o braco de novo na frente, recortado no arco de baixo do vao. E o
    que poe o aro de tras atras do punho e o de perto na frente. Os dois
    recortes de compor.html partem do mesmo arco, entao nenhum pedaco do
    braco e pintado duas vezes — o que importa, porque ele e semitransparente.

    O vao foi medido na propria foto: elipse de centro (423, 588) e raios
    281,6 x 75,6. O punho tem 52% dessa largura, que e a folga certa entre o
    braco e o metal. A foto entra em x 41,9..801,9 / y 346..804,3.

    O braco e desenhado na vertical e deitado pelo `rotate` do grupo — mexer
    num dos dois pede recalcular o outro. A inclinacao de 22 graus continua
    valendo: recipiente e vertical, membro nao, e a pulseira fica nivelada,
    que e onde ela mesma ficaria, solta no pulso.
  -->
  <defs>
    <!--
      O cilindro. Atravessa a largura do braco (x 203 a 643 no sistema local,
      antes da rotacao), nao a altura: e a secao que e redonda. A banda clara
      fica a um quarto da largura, nao no meio, que e onde ela cai num
      cilindro iluminado de cima e da esquerda; a aresta direita recebe o
      rebote quente da luz da marca.
    -->
    <linearGradient id="cilindro" gradientUnits="userSpaceOnUse"
                    x1="203" y1="0" x2="643" y2="0">
      <stop offset="0" stop-color="#0B0B10"/>
      <stop offset="0.08" stop-color="#1F1F27"/>
      <stop offset="0.26" stop-color="#2C2C36"/>
      <stop offset="0.42" stop-color="#25252E"/>
      <stop offset="0.64" stop-color="#1A1A21"/>
      <stop offset="0.85" stop-color="#101016"/>
      <stop offset="0.95" stop-color="#1D1319"/>
      <stop offset="1" stop-color="#2E1C11"/>
    </linearGradient>

    <!-- As duas pontas se perdendo no ar. -->
    <linearGradient id="desvanece" gradientUnits="userSpaceOnUse"
                    x1="0" y1="60" x2="0" y2="1060">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.15" stop-color="#FFFFFF"/>
      <stop offset="0.78" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <mask id="pontas" maskUnits="userSpaceOnUse"
          x="-300" y="-300" width="1500" height="1800">
      <rect x="-300" y="-300" width="1500" height="1800" fill="url(#desvanece)"/>
    </mask>

    <!--
      A ampulheta. De cima para baixo: ventre do antebraco, descida para o
      punho, o estiloide da ulna saindo do contorno a direita, o punho no
      ponto mais estreito e a base da mao abrindo de novo, mais do lado do
      polegar que do outro.
    -->
    <path id="silhueta" d="M208 60
      C 203 180 206 310 232 440
      C 256 520 270 558 276 596
      C 272 650 260 700 255 752
      C 238 812 226 874 222 936
      C 219 992 212 1030 210 1060
      L 616 1060
      C 614 1030 610 992 606 936
      C 602 874 594 812 591 752
      C 586 700 574 650 570 596
      C 572 572 580 556 586 544
      C 598 536 601 520 593 506
      C 601 478 608 456 614 440
      C 640 310 643 180 638 60 Z"/>
    <clipPath id="corpo"><use href="#silhueta"/></clipPath>

    <path id="ladoD" d="M638 60 C 643 180 640 310 614 440
      C 608 456 601 478 593 506 C 601 520 598 536 586 544
      C 580 556 572 572 570 596 C 574 650 586 700 591 752
      C 594 812 602 874 606 936 C 610 992 614 1030 616 1060"/>
    <path id="ladoE" d="M208 60 C 203 180 206 310 232 440
      C 256 520 270 558 276 596 C 272 650 260 700 255 752
      C 238 812 226 874 222 936 C 219 992 212 1030 210 1060"/>
  </defs>

  <g transform="rotate(-22 423 588)">
    <g mask="url(#pontas)">
      <use href="#silhueta" fill="url(#cilindro)"/>

      <g clip-path="url(#corpo)" fill="none" stroke-linecap="round">
        <!-- o brilho da pele na banda de luz, estreito e fora do centro -->
        <path d="M296 150 C 286 340 318 540 326 736
                 C 310 850 300 952 296 1030"
              stroke="#F2F2FA" stroke-opacity="0.07" stroke-width="54"/>
        <path d="M290 220 C 282 380 312 540 318 700"
              stroke="#F2F2FA" stroke-opacity="0.06" stroke-width="18"/>

        <!-- a sombra que fecha o lado de dentro -->
        <path d="M566 140 C 578 330 548 540 548 740
                 C 556 860 566 960 570 1030"
              stroke="#000000" stroke-opacity="0.3" stroke-width="44"/>

        <!-- a veia, que corre do dorso da mao para o antebraco -->
        <path d="M470 300 C 452 420 468 520 450 604"
              stroke="#F2F2FA" stroke-opacity="0.035" stroke-width="12"/>

        <!-- O sulco raso entre os dois grupos de tendoes. Os tendoes em si
             sairam: desenhados como linhas claras eles viram barras pousadas
             no braco, e o punho passa a parecer riscado. Uma sombra larga
             diz a mesma coisa sem deixar marca. -->
        <path d="M423 430 C 423 492 423 548 423 600"
              stroke="#000000" stroke-opacity="0.1" stroke-width="34"/>

        <!-- o estiloide, pegando luz por cima e sombra por baixo -->
        <path d="M582 506 C 596 514 601 524 597 536"
              stroke="#F2F2FA" stroke-opacity="0.1" stroke-width="16"/>
        <path d="M578 546 C 590 544 597 538 600 530"
              stroke="#000000" stroke-opacity="0.22" stroke-width="12"/>

        <!-- os dois vincos do punho, insinuados e nao riscados -->
        <g stroke="#000000" stroke-opacity="0.13" stroke-width="11">
          <path d="M304 468 C 354 486 494 486 544 468"/>
          <path d="M300 504 C 352 522 498 522 550 504"/>
        </g>

        <!-- a sombra que a pulseira joga no punho, logo acima dela -->
        <path d="M286 560 C 346 584 500 584 560 560"
              stroke="#000000" stroke-opacity="0.4" stroke-width="56"/>

        <!-- o monte do polegar, cheio, e a ruga da base da mao -->
        <path d="M266 818 C 248 876 242 926 246 976"
              stroke="#F2F2FA" stroke-opacity="0.055" stroke-width="56"/>
        <path d="M252 790 C 300 806 352 812 392 806"
              stroke="#000000" stroke-opacity="0.14" stroke-width="12"/>

        <!-- o inicio das juntas, ja quase apagado pela ponta que se desfaz -->
        <path d="M236 988 C 306 958 526 958 596 988"
              stroke="#F2F2FA" stroke-opacity="0.045" stroke-width="40"/>
      </g>

      <!-- ===================== O CONTORNO =====================
           Agora e so a luz que lambe a borda, nao mais o desenho inteiro:
           duas passagens de cada lado, acesa na direita e fria na esquerda,
           que e o mesmo par de luzes do acrilico das placas. -->
      <g fill="none" stroke-linecap="round">
        <g stroke="#FF7700">
          <use href="#ladoD" stroke-width="30" opacity="0.1"/>
          <use href="#ladoD" stroke-width="11" opacity="0.18"/>
          <use href="#ladoD" stroke-width="2.6" opacity="0.5"/>
        </g>
        <g stroke="#E6EAF6">
          <use href="#ladoE" stroke-width="22" opacity="0.07"/>
          <use href="#ladoE" stroke-width="8" opacity="0.13"/>
          <use href="#ladoE" stroke-width="2.2" opacity="0.45"/>
        </g>
      </g>
    </g>
  </g>
</svg>
