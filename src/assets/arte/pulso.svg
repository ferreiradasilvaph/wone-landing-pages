<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 880" width="760" height="880">
  <defs>
    <linearGradient id="pele" x1="0.05" y1="0.1" x2="0.95" y2="0.8">
      <stop offset="0" stop-color="#53535F"/>
      <stop offset="0.42" stop-color="#2E2E3A"/>
      <stop offset="0.82" stop-color="#17171F"/>
      <stop offset="1" stop-color="#101016"/>
    </linearGradient>
    <linearGradient id="metal" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFE3"/>
      <stop offset="0.4" stop-color="#CFD4DF"/>
      <stop offset="0.75" stop-color="#8F96A5"/>
      <stop offset="1" stop-color="#EDF1F8"/>
    </linearGradient>
    <linearGradient id="brasa" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#FFB267"/>
      <stop offset="0.45" stop-color="#FF7700"/>
      <stop offset="1" stop-color="#C25400"/>
    </linearGradient>
    <linearGradient id="chapa" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#F2F5FB"/>
      <stop offset="0.5" stop-color="#AEB5C4"/>
      <stop offset="1" stop-color="#E6EAF2"/>
    </linearGradient>

    <!-- Mão e antebraço numa silhueta só. Os entalhes no alto são os dedos:
         é a única coisa que, do tamanho em que isto aparece, diz "mão". -->
    <path id="braco" d="M-104 430
      C -98 298 -82 158 -66 26
      C -72 -8 -90 -24 -110 -48
      C -128 -70 -124 -102 -103 -108
      C -85 -113 -77 -94 -76 -68
      C -75 -52 -78 -118 -78 -142
      L -78 -248 A 22 22 0 0 1 -34 -248
      L -34 -176 L -28 -176
      L -28 -282 A 22 22 0 0 1 16 -282
      L 16 -180 L 22 -180
      L 22 -264 A 22 22 0 0 1 66 -264
      L 66 -172 L 72 -172
      L 72 -224 A 19 19 0 0 1 110 -224
      L 110 -140
      C 113 -90 101 -40 92 10
      C 96 158 102 298 106 430 Z"/>
    <clipPath id="dentro"><use href="#braco"/></clipPath>
  </defs>

  <g transform="translate(372 430) rotate(-11)">
    <!-- a volta da pulseira que passa por trás do braço -->
    <g transform="translate(2 96)">
      <ellipse cx="0" cy="0" rx="92" ry="30" fill="none"
               stroke="#5F6675" stroke-width="32"/>
    </g>

    <!-- ===================== O BRAÇO ===================== -->
    <use href="#braco" fill="url(#pele)"/>

    <g clip-path="url(#dentro)">
      <!-- a luz da marca na borda direita -->
      <g fill="none" stroke="url(#brasa)" stroke-linecap="round">
        <path d="M110 -224 L 110 -140 C 113 -90 101 -40 92 10 C 96 158 102 298 106 430"
              stroke-width="62" opacity="0.1"/>
        <path d="M110 -224 L 110 -140 C 113 -90 101 -40 92 10 C 96 158 102 298 106 430"
              stroke-width="30" opacity="0.22"/>
        <path d="M110 -224 L 110 -140 C 113 -90 101 -40 92 10 C 96 158 102 298 106 430"
              stroke-width="12" opacity="0.5"/>
        <path d="M110 -224 L 110 -140 C 113 -90 101 -40 92 10 C 96 158 102 298 106 430"
              stroke-width="4" opacity="0.9"/>
      </g>
      <!-- o contorno frio do outro lado -->
      <g fill="none" stroke="#FFFFE3" stroke-linecap="round">
        <path d="M-78 -248 L -78 -142 C -77 -94 -85 -113 -103 -108 C -124 -102 -128 -70 -110 -48 C -90 -24 -72 -8 -66 26 C -82 158 -98 298 -104 430"
              stroke-width="40" opacity="0.1"/>
        <path d="M-78 -248 L -78 -142 C -77 -94 -85 -113 -103 -108 C -124 -102 -128 -70 -110 -48 C -90 -24 -72 -8 -66 26 C -82 158 -98 298 -104 430"
              stroke-width="10" opacity="0.3"/>
      </g>

      <!-- os vãos entre os dedos, que separam o que a silhueta já insinua -->
      <g fill="none" stroke="#000000" stroke-opacity="0.45" stroke-width="7"
         stroke-linecap="round">
        <path d="M-31 -174 L -31 -118"/>
        <path d="M19 -178 L 19 -116"/>
        <path d="M69 -170 L 69 -118"/>
      </g>
      <!-- as juntas -->
      <g fill="none" stroke="#000000" stroke-opacity="0.26" stroke-width="6"
         stroke-linecap="round">
        <path d="M-66 -156 C -40 -168 -12 -170 8 -164"/>
        <path d="M18 -162 C 44 -168 70 -166 92 -156"/>
      </g>
      <!-- o dorso da mão, onde a luz bate -->
      <path d="M-56 -110 C -20 -126 30 -128 76 -112"
            fill="none" stroke="#FFFFE3" stroke-opacity="0.08" stroke-width="40"
            stroke-linecap="round"/>

      <!-- o vinco que separa o polegar da palma -->
      <path d="M-74 -62 C -92 -44 -98 -20 -92 4"
            fill="none" stroke="#000000" stroke-opacity="0.34" stroke-width="7"
            stroke-linecap="round"/>

      <!-- o vinco do pulso -->
      <path d="M-62 36 C -24 48 24 48 62 36"
            fill="none" stroke="#000000" stroke-opacity="0.28" stroke-width="6"
            stroke-linecap="round"/>

      <!-- a sombra que a pulseira projeta -->
      <ellipse cx="4" cy="112" rx="94" ry="36" fill="#000000" opacity="0.42"/>
    </g>

    <!-- ===== a volta da pulseira que passa na frente ===== -->
    <g transform="translate(2 96)">
      <path d="M-92 0 A 92 30 0 0 0 92 0" fill="none"
            stroke="url(#metal)" stroke-width="32" stroke-linecap="round"/>
      <path d="M-92 0 A 92 30 0 0 0 92 0" fill="none"
            stroke="#0B0B10" stroke-opacity="0.5" stroke-width="33"
            stroke-dasharray="2.5 15" stroke-linecap="butt"/>
      <path d="M-92 0 A 92 30 0 0 0 92 0" fill="none"
            stroke="#FFFFE3" stroke-opacity="0.4" stroke-width="7"
            transform="translate(0,-7)" stroke-linecap="round"/>

      <!-- a plaqueta -->
      <g transform="translate(0 28)">
        <rect x="-80" y="-28" width="160" height="56" rx="24" fill="url(#chapa)"/>
        <rect x="-80" y="-28" width="160" height="56" rx="24" fill="none"
              stroke="#0B0B10" stroke-opacity="0.35" stroke-width="3"/>
        <g fill="#FFFFFF" opacity="0.9">
          <circle cx="-62" cy="-10" r="3.6"/><circle cx="-50" cy="-10" r="3.6"/>
          <circle cx="-62" cy="10" r="3.6"/><circle cx="-50" cy="10" r="3.6"/>
          <circle cx="62" cy="-10" r="3.6"/><circle cx="50" cy="-10" r="3.6"/>
          <circle cx="62" cy="10" r="3.6"/><circle cx="50" cy="10" r="3.6"/>
        </g>
        <g fill="none" stroke="url(#brasa)" stroke-width="13"
           stroke-linecap="round" stroke-linejoin="round" transform="scale(0.33)">
          <path d="M-89.3 -21.1 A 50 50 0 1 1 -89.3 21.1"/>
          <path d="M89.3 -21.1 A 50 50 0 1 0 89.3 21.1"/>
          <path d="M-120 -34 L -46 0 L -120 34"/>
          <path d="M120 -34 L 46 0 L 120 34"/>
        </g>
      </g>
    </g>
  </g>
</svg>
