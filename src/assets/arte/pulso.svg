<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" width="760" height="760">
  <defs>
    <linearGradient id="pele" x1="0.05" y1="0" x2="0.95" y2="0.4">
      <stop offset="0" stop-color="#363642"/>
      <stop offset="0.42" stop-color="#1E1E27"/>
      <stop offset="0.82" stop-color="#101016"/>
      <stop offset="1" stop-color="#0C0C11"/>
    </linearGradient>
    <linearGradient id="metal" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFE3"/>
      <stop offset="0.4" stop-color="#CFD4DF"/>
      <stop offset="0.75" stop-color="#8F96A5"/>
      <stop offset="1" stop-color="#EDF1F8"/>
    </linearGradient>
    <linearGradient id="brasa" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#FFB267"/>
      <stop offset="0.45" stop-color="#FF7700"/>
      <stop offset="1" stop-color="#C25400"/>
    </linearGradient>
    <linearGradient id="chapa" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#F2F5FB"/>
      <stop offset="0.5" stop-color="#AEB5C4"/>
      <stop offset="1" stop-color="#E6EAF2"/>
    </linearGradient>

    <!-- Punho fechado e antebraço, numa silhueta só. O estreitamento no meio
         é o pulso — é ele que dá a escala e faz a peça ser pulseira. -->
    <path id="braco" d="M-62 30
      C -68 -24 -96 -58 -101 -112
      C -106 -174 -70 -222 -8 -229
      C 52 -236 106 -204 112 -146
      C 117 -98 108 -38 94 14
      C 88 38 86 64 88 92
      C 94 220 100 330 104 430
      L -102 430
      C -96 318 -76 160 -62 30 Z"/>
    <clipPath id="dentro"><use href="#braco"/></clipPath>
  </defs>

  <g transform="translate(380 330) rotate(-14)">
    <!-- ===== a parte da pulseira que passa POR TRÁS do braço ===== -->
    <g transform="translate(6 76)">
      <ellipse cx="0" cy="0" rx="86" ry="29" fill="none"
               stroke="#5F6675" stroke-width="30"/>
    </g>

    <!-- ===================== O BRAÇO ===================== -->
    <use href="#braco" fill="url(#pele)"/>

    <g clip-path="url(#dentro)">
      <!-- a luz da marca correndo pela borda direita -->
      <g fill="none" stroke="url(#brasa)" stroke-linecap="round">
        <path d="M60 -430 C 62 -330 68 -230 74 -140 C 92 60 100 240 104 430"
              stroke-width="66" opacity="0.1"/>
        <path d="M60 -430 C 62 -330 68 -230 74 -140 C 92 60 100 240 104 430"
              stroke-width="32" opacity="0.22"/>
        <path d="M60 -430 C 62 -330 68 -230 74 -140 C 92 60 100 240 104 430"
              stroke-width="13" opacity="0.5"/>
        <path d="M60 -430 C 62 -330 68 -230 74 -140 C 92 60 100 240 104 430"
              stroke-width="4.5" opacity="0.9"/>
      </g>
      <!-- o contorno frio do outro lado -->
      <g fill="none" stroke="#FFFFE3" stroke-linecap="round">
        <path d="M-60 -430 C -62 -330 -68 -230 -74 -140 C -92 60 -100 240 -104 430"
              stroke-width="40" opacity="0.07"/>
        <path d="M-60 -430 C -62 -330 -68 -230 -74 -140 C -92 60 -100 240 -104 430"
              stroke-width="9" opacity="0.17"/>
      </g>

      <!-- o polegar, dobrado sobre os dedos -->
      <path d="M-96 -86 C -74 -118 -34 -132 2 -122 C 22 -116 30 -96 22 -78
               C 12 -56 -26 -44 -58 -50 C -82 -54 -94 -68 -96 -86 Z"
            fill="#FFFFE3" fill-opacity="0.05"/>
      <path d="M-96 -86 C -74 -118 -34 -132 2 -122"
            fill="none" stroke="#000000" stroke-opacity="0.3" stroke-width="6"
            stroke-linecap="round"/>
      <!-- os vincos dos nós dos dedos -->
      <g fill="none" stroke="#000000" stroke-opacity="0.26" stroke-width="6"
         stroke-linecap="round">
        <path d="M34 -196 C 52 -178 60 -156 60 -132"/>
        <path d="M74 -176 C 88 -156 94 -136 94 -116"/>
      </g>
      <path d="M-6 -224 C 40 -220 82 -196 100 -160"
            fill="none" stroke="#FFFFE3" stroke-opacity="0.1" stroke-width="16"
            stroke-linecap="round"/>

      <!-- a sombra que a pulseira projeta na pele -->
      <ellipse cx="6" cy="92" rx="88" ry="34" fill="#000000" opacity="0.4"/>
    </g>

    <!-- ===== a parte da pulseira que passa NA FRENTE ===== -->
    <g transform="translate(6 76)">
      <!-- o metal -->
      <path d="M-86 0 A 86 29 0 0 0 86 0" fill="none"
            stroke="url(#metal)" stroke-width="30" stroke-linecap="round"/>
      <!-- os vincos entre os elos -->
      <path d="M-86 0 A 86 29 0 0 0 86 0" fill="none"
            stroke="#0B0B10" stroke-opacity="0.5" stroke-width="31"
            stroke-dasharray="2.5 15" stroke-linecap="butt"/>
      <!-- o brilho que corre por cima -->
      <path d="M-86 0 A 86 29 0 0 0 86 0" fill="none"
            stroke="#FFFFE3" stroke-opacity="0.4" stroke-width="7"
            transform="translate(0,-7)" stroke-linecap="round"/>

      <!-- a plaqueta, com a marca em ouro -->
      <g transform="translate(0 26)">
        <rect x="-80" y="-28" width="160" height="56" rx="24"
              fill="url(#chapa)"/>
        <rect x="-80" y="-28" width="160" height="56" rx="24"
              fill="none" stroke="#0B0B10" stroke-opacity="0.35" stroke-width="3"/>
        <!-- a cravação, uma fileira de cada lado da marca -->
        <g fill="#FFFFFF" opacity="0.9">
          <circle cx="-62" cy="-10" r="3.6"/><circle cx="-50" cy="-10" r="3.6"/>
          <circle cx="-62" cy="10" r="3.6"/><circle cx="-50" cy="10" r="3.6"/>
          <circle cx="62" cy="-10" r="3.6"/><circle cx="50" cy="-10" r="3.6"/>
          <circle cx="62" cy="10" r="3.6"/><circle cx="50" cy="10" r="3.6"/>
        </g>
        <!-- a marca Wone, no meio da plaqueta -->
        <g fill="none" stroke="url(#brasa)" stroke-width="13"
           stroke-linecap="round" stroke-linejoin="round" transform="scale(0.33)">
          <path d="M-89.3 -21.1 A 50 50 0 1 1 -89.3 21.1"/>
          <path d="M89.3 -21.1 A 50 50 0 1 0 89.3 21.1"/>
          <path d="M-120 -34 L -46 0 L -120 34"/>
          <path d="M120 -34 L 46 0 L 120 34"/>
        </g>
      </g>
    </g>
  </g>
</svg>
