<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" width="760" height="760">
  <defs>
    <linearGradient id="pele" x1="0.14" y1="0.18" x2="0.86" y2="0.82">
      <stop offset="0" stop-color="#5E5E6C"/>
      <stop offset="0.46" stop-color="#32323F"/>
      <stop offset="0.8" stop-color="#17171F"/>
      <stop offset="1" stop-color="#101016"/>
    </linearGradient>

    <linearGradient id="topo" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#40404E"/>
      <stop offset="1" stop-color="#17171E"/>
    </linearGradient>

    <linearGradient id="metal" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFE3"/>
      <stop offset="0.4" stop-color="#CFD4DF"/>
      <stop offset="0.75" stop-color="#8F96A5"/>
      <stop offset="1" stop-color="#EDF1F8"/>
    </linearGradient>

    <linearGradient id="brasa" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#FFB267"/>
      <stop offset="0.45" stop-color="#FF7700"/>
      <stop offset="1" stop-color="#C25400"/>
    </linearGradient>

    <!-- O recorte do busto, reaproveitado pela silhueta e pelas luzes -->
    <path id="silhueta" d="M320 30
      L 318 136
      C 316 184 298 204 258 222
      C 192 250 124 278 94 310
      C 72 334 64 360 60 396
      C 56 470 52 600 56 760
      L 704 760
      C 708 600 704 470 700 396
      C 696 360 688 334 666 310
      C 636 278 568 250 502 222
      C 462 204 444 184 442 136
      L 440 30 Z"/>
    <clipPath id="corpo"><use href="#silhueta"/></clipPath>
  </defs>

  <!-- ===================== O BUSTO ===================== -->
  <use href="#silhueta" fill="url(#pele)"/>

  <g clip-path="url(#corpo)">
    <!-- A luz da marca correndo pela borda direita. Três passagens de
         espessura decrescente no lugar de um desfoque: assim o resultado não
         depende do rasterizador ter filtro, e a queda fica igual. -->
    <g fill="none" stroke="url(#brasa)" stroke-linecap="round">
      <path d="M440 30 L 442 136 C 444 184 462 204 502 222 C 568 250 636 278 666 310 C 688 334 696 360 700 396 C 704 470 708 600 704 760"
            stroke-width="76" opacity="0.1"/>
      <path d="M440 30 L 442 136 C 444 184 462 204 502 222 C 568 250 636 278 666 310 C 688 334 696 360 700 396 C 704 470 708 600 704 760"
            stroke-width="38" opacity="0.22"/>
      <path d="M440 30 L 442 136 C 444 184 462 204 502 222 C 568 250 636 278 666 310 C 688 334 696 360 700 396 C 704 470 708 600 704 760"
            stroke-width="15" opacity="0.5"/>
      <path d="M440 30 L 442 136 C 444 184 462 204 502 222 C 568 250 636 278 666 310 C 688 334 696 360 700 396 C 704 470 708 600 704 760"
            stroke-width="5" opacity="0.9"/>
    </g>

    <!-- O mesmo na esquerda, em creme e bem mais fraco: só para o volume não
         ficar iluminado de um lado só. -->
    <g fill="none" stroke="#FFFFE3" stroke-linecap="round">
      <path d="M320 30 L 318 136 C 316 184 298 204 258 222 C 192 250 124 278 94 310 C 72 334 64 360 60 396 C 56 470 52 600 56 760"
            stroke-width="46" opacity="0.1"/>
      <path d="M320 30 L 318 136 C 316 184 298 204 258 222 C 192 250 124 278 94 310 C 72 334 64 360 60 396 C 56 470 52 600 56 760"
            stroke-width="11" opacity="0.3"/>
    </g>

    <!-- Sombra que o maxilar deixaria no pescoço -->
    <ellipse cx="380" cy="22" rx="98" ry="54" fill="#000000" opacity="0.42"/>
    <!-- Sombra onde o pescoço encontra o peito -->
    <ellipse cx="380" cy="214" rx="130" ry="56" fill="#000000" opacity="0.3"/>

    <!-- O volume do peito: um realce largo de um lado e sombra do outro. Sem
         isto o tronco é uma chapa, por mais degradê que tenha. -->
    <ellipse cx="282" cy="420" rx="150" ry="210" fill="#FFFFE3" opacity="0.055"/>
    <ellipse cx="506" cy="470" rx="130" ry="220" fill="#000000" opacity="0.22"/>

    <!-- Onde o braço encosta no peito. Sem este par de vincos o tronco e os
         braços são uma massa só, e a silhueta lê como sino. -->
    <path d="M150 392 C 136 500 132 630 136 760"
          fill="none" stroke="#000000" stroke-opacity="0.34" stroke-width="14"
          stroke-linecap="round"/>
    <path d="M610 392 C 624 500 628 630 624 760"
          fill="none" stroke="#000000" stroke-opacity="0.4" stroke-width="14"
          stroke-linecap="round"/>

    <!-- Clavículas -->
    <path d="M268 252 C 312 290 348 302 380 302 C 412 302 448 290 492 252"
          fill="none" stroke="#FFFFE3" stroke-opacity="0.12" stroke-width="7"
          stroke-linecap="round"/>
    <path d="M268 262 C 312 300 348 312 380 312 C 412 312 448 300 492 262"
          fill="none" stroke="#000000" stroke-opacity="0.3" stroke-width="7"
          stroke-linecap="round"/>
  </g>

  <!-- A face cortada no alto do pescoço: é o que diz "busto de joalheria" -->
  <ellipse cx="380" cy="30" rx="60" ry="17" fill="url(#topo)"/>
  <path d="M320 30 A 60 17 0 0 0 440 30" fill="none" stroke="#FFFFE3"
        stroke-opacity="0.22" stroke-width="2.5"/>

  <!-- ===================== O COLAR ===================== -->
  <g fill="none" stroke-linecap="round">
    <!-- sombra da corrente sobre a pele -->
    <path d="M300 140 C 304 252 334 320 380 320 C 426 320 456 252 460 140"
          stroke="#000000" stroke-opacity="0.5" stroke-width="16"
          transform="translate(4,7)"/>
    <!-- o metal -->
    <path d="M300 140 C 304 252 334 320 380 320 C 426 320 456 252 460 140"
          stroke="url(#metal)" stroke-width="16"/>
    <!-- os vincos que separam elo de elo: finos e juntos, senao a corrente
         vira colar de contas -->
    <path d="M300 140 C 304 252 334 320 380 320 C 426 320 456 252 460 140"
          stroke="#0B0B10" stroke-opacity="0.55" stroke-width="17"
          stroke-dasharray="1.6 8"/>
    <!-- o brilho corre continuo por cima, nao pontilhado -->
    <path d="M300 140 C 304 252 334 320 380 320 C 426 320 456 252 460 140"
          stroke="#FFFFE3" stroke-opacity="0.72" stroke-width="4"
          transform="translate(-2.5,-2.5)"/>
  </g>

  <!-- O pingente: a marca Wone. Cada anel abre para fora, e o chevron nasce
       das duas pontas da abertura e aponta para o centro — é o desenho da
       marca, não dois círculos com setas em volta. -->
  <g transform="translate(380 320)">
    <ellipse cx="0" cy="18" rx="13" ry="10" fill="none" stroke="url(#metal)"
             stroke-width="7"/>

    <g transform="translate(0 104)">
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- os dois aneis, cada um aberto para o seu lado de fora -->
        <g stroke="url(#metal)" stroke-width="26">
          <path d="M-89.3 -21.1 A 50 50 0 1 1 -89.3 21.1"/>
          <path d="M89.3 -21.1 A 50 50 0 1 0 89.3 21.1"/>
        </g>
        <g stroke="url(#brasa)" stroke-width="13">
          <path d="M-89.3 -21.1 A 50 50 0 1 1 -89.3 21.1"/>
          <path d="M89.3 -21.1 A 50 50 0 1 0 89.3 21.1"/>
        </g>
        <!-- os chevrons: entram pela abertura e miram o centro do anel -->
        <g stroke="url(#metal)" stroke-width="19">
          <path d="M-120 -34 L -46 0 L -120 34"/>
          <path d="M120 -34 L 46 0 L 120 34"/>
        </g>
        <g stroke="url(#brasa)" stroke-width="9">
          <path d="M-120 -34 L -46 0 L -120 34"/>
          <path d="M120 -34 L 46 0 L 120 34"/>
        </g>
      </g>
    </g>
  </g>
</svg>
